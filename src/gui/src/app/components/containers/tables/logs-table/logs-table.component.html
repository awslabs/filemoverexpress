<div class="logs-table-wrapper">
    <div class="inputs-section">
        <div class="filter" [formGroup]="filterForm">
            <mat-form-field color="accent" appearance="outline">
                <mat-label>Search</mat-label>
                <input matInput type="text" formControlName="keywords">
            </mat-form-field>

            <mat-form-field color="accent" appearance="outline">
                <mat-label>Levels</mat-label>
                <mat-select multiple formControlName="levels">
                    @for (level of levels; track level) {
                        <mat-option [value]="level">
                            {{ level }}
                        </mat-option>
                    }
                </mat-select>
            </mat-form-field>

            <span class="spacer"></span>

            <mat-form-field color="accent" appearance="outline" id="jobSelector">
                <mat-label>Jobs</mat-label>
                <mat-select formControlName="jobs">
                    <mat-option>All jobs</mat-option>
                    @for (job of jobs$ | async; track job) {
                        <mat-option [value]="job.id">
                            {{ job.name }}
                        </mat-option>
                    }
                </mat-select>
            </mat-form-field>
        </div>
    </div>
    <div class="table-section">
        <div class="logs-container">
            <table mat-table matSort [dataSource]="dataSource">
                <ng-container matColumnDef="timestamp">
                    <th mat-header-cell *matHeaderCellDef mat-sort-header>Timestamp</th>
                    <td mat-cell *matCellDef="let element">
                        {{ element.timestamp | date : 'yyyy-MM-dd HH:mm:ss' }}
                    </td>
                </ng-container>

                <ng-container matColumnDef="level">
                    <th mat-header-cell *matHeaderCellDef mat-sort-header>Level</th>
                    <td mat-cell *matCellDef="let element">
                        {{ element.level }}
                    </td>
                </ng-container>

                <ng-container matColumnDef="message">
                    <th mat-header-cell *matHeaderCellDef mat-sort-header>Message</th>
                    <td mat-cell *matCellDef="let element">
                        {{ element.message }}
                    </td>
                </ng-container>


                <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
                <tr mat-row
                    *matRowDef="let row; columns: displayedColumns;"
                    [ngClass]="{'row-warn': row.level === 'warning','row-error': row.level === 'error'}"
                ></tr>
                <tr class="mat-row" *matNoDataRow>
                    <td class="mat-cell no-data" [attr.colspan]="displayedColumns.length">No data matching the filter
                    </td>
                </tr>
            </table>
        </div>
    </div>
</div>
