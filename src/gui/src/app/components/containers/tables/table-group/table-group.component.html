<div class="tray-shell">
    @if (!tray.collapsed()) {
        <div class="tray-expanded">
            <button class="tray-collapse-top" type="button" (click)="tray.collapse()" aria-label="Collapse transfers">&#9660;</button>
            <mat-tab-group mat-stretch-tabs="false" mat-align-tabs="start" color="accent" class="table-group-wrapper"
                           [selectedIndex]="tray.activeTab()" (selectedIndexChange)="tray.setActiveTab($event)">
                <mat-tab label="Jobs">
                    <fme-jobs-table></fme-jobs-table>
                </mat-tab>
                <mat-tab label="Logs">
                    <fme-logs-table></fme-logs-table>
                </mat-tab>
                <mat-tab label="Bucket Reports">
                    <fme-reports-table></fme-reports-table>
                </mat-tab>
            </mat-tab-group>
        </div>
    }

    <!-- Persistent summary bar: always at the bottom. When collapsed it is the expand
         affordance (▲); when expanded the collapse control (▼) lives at the top of the tabs. -->
    <button class="tray-summary-bar"
            type="button"
            [class.expanded]="!tray.collapsed()"
            (click)="onSummaryClick()"
            [attr.aria-label]="tray.collapsed() ? 'Expand transfers' : 'Collapse transfers'">
        @if (activeJobs() === 0 && generatingReports() === 0) {
            <span class="tray-idle">No active transfers</span>
        } @else {
            @if (activeJobs() > 0) {
                <span class="tray-badge">{{ activeJobs() }} jobs</span>
                @if (downloadActive() > 0) {
                    <span class="tray-stat">
                        <span class="tri down">&#9660;</span>
                        <span class="value">{{ downloadSpeed() }}</span>
                    </span>
                }
                @if (uploadActive() > 0) {
                    <span class="tray-stat">
                        <span class="tri up">&#9650;</span>
                        <span class="value">{{ uploadSpeed() }}</span>
                    </span>
                }
                <span class="tray-meta">{{ summaryTransferred() }} of {{ summaryTotal() }}</span>
                <span class="tray-meta"><span class="label">ETA:</span> <span class="value">{{ summaryEta() }}</span></span>
            }
            @if (generatingReports() > 0) {
                <span class="tray-report">
                    <span class="report-spinner">&#9696;</span>
                    {{ generatingReports() }} {{ generatingReports() === 1 ? 'report' : 'reports' }} generating&hellip;
                </span>
            }
        }
        <span class="spacer"></span>
        @if (tray.collapsed()) {
            <span class="tray-caret" [class.active]="activeJobs() > 0 || generatingReports() > 0">&#9650;</span>
        }
    </button>
</div>
