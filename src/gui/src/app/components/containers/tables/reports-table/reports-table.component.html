<div class="reports-table-wrapper">
    <div class="inputs-section">
        <div class="filter">
            <mat-form-field color="accent" appearance="outline">
                <mat-label>Search</mat-label>
                <input matInput (keyup)="applyFilter($event)">
            </mat-form-field>
        </div>
    </div>
    <div class="table-section">
        <div class="reports-container">
            <table mat-table matSort [dataSource]="dataSource">
                <ng-container matColumnDef="remoteConfiguration">
                    <th mat-header-cell *matHeaderCellDef mat-sort-header>Remote Configuration</th>
                    <td mat-cell *matCellDef="let report">{{ report.transferProfile }}</td>
                </ng-container>
                <ng-container matColumnDef="bucket">
                    <th mat-header-cell *matHeaderCellDef mat-sort-header>S3 Bucket</th>
                    <td mat-cell *matCellDef="let report">{{ report.bucket }}</td>
                </ng-container>

                <ng-container matColumnDef="status">
                    <th mat-header-cell *matHeaderCellDef mat-sort-header>Status</th>
                    <td mat-cell *matCellDef="let report">{{ report.status }}</td>
                </ng-container>

                <ng-container matColumnDef="started">
                    <th mat-header-cell *matHeaderCellDef mat-sort-header>Started</th>
                    <td mat-cell *matCellDef="let report">{{ report.started | date: 'yyyy-MM-dd HH:mm' }}</td>
                </ng-container>

                <ng-container matColumnDef="completed">
                    <th mat-header-cell *matHeaderCellDef mat-sort-header>Completed</th>
                    <td mat-cell *matCellDef="let report">{{ report.completed | date: 'yyyy-MM-dd HH:mm' }}</td>
                </ng-container>

                <ng-container matColumnDef="outputFile">
                    <th mat-header-cell *matHeaderCellDef mat-sort-header>Report</th>
                    <td mat-cell *matCellDef="let report">
                        <a href="#" (click)="openItemInFolder($event, report.outputFile)">
                            {{ report.outputFile }}
                        </a>
                    </td>
                </ng-container>

                <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
                <tr mat-row *matRowDef="let _row; columns: displayedColumns;"></tr>
            </table>
        </div>
    </div>
</div>
