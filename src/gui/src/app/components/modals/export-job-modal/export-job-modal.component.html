<header mat-dialog-title class="dialog-title">
    <h1>Export Job Report</h1>
    <div class="spacer"></div>
</header>
<mat-dialog-content
    (fmeEnterSubmit)="submit()()"
    [enterSubmitDisabled]="outputFormat.invalid">
    <div class="modal-text">
        Export job report and save it in the following format
    </div>
    <div class="form">
        <mat-form-field color="accent">
            <mat-label>Output format</mat-label>
            <mat-select [formControl]="outputFormat">
                @for (format of outputFormats | keyvalue; track format) {
                    <mat-option [value]="format.value">{{ format.key }}</mat-option>
                }
            </mat-select>
        </mat-form-field>
    </div>
</mat-dialog-content>

<div mat-dialog-actions class="modal-buttons">
    <fme-button type="stroked" text="Cancel" [onClick]="close()"></fme-button>
    <fme-button type="filled"
                text="Export"
                [disabled]="outputFormat.invalid"
                [onClick]="submit()"
    ></fme-button>
</div>
