version: '3'

tasks:
  build:
    desc: Build Angular GUI (production)
    cmds:
      - npx ng build --configuration=production --base-href=./

  test:
    desc: Run Angular GUI tests
    cmds:
      - npx ng test --watch=false --coverage
    env:
        NODE_OPTIONS: "--no-experimental-webstorage"

  lint:
    desc: Run Angular ESLint
    cmds:
      - npx ng lint
