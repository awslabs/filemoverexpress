syntax = "proto3";

package fme.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/awslabs/filemoverexpress/protobuf";

message FsFile {
    string path = 1;
    int64 size = 2;
    google.protobuf.Timestamp last_modified = 3;
}

message FsFolder {
    string path = 1;
    repeated string folders = 2;
    repeated FsFile files = 3;
    bool success = 4;
}

message ListFolderRequest {
    string path = 1;
}

message CreateLocalFolderRequest {
    string path = 1;
}

message CreateLocalFolderResponse {
    bool success = 1;
    string message = 2;
}


message DeleteLocalPathRequest {
    string path_to_delete = 1;
    string path_type = 2;
}

message DeleteLocalPathResponse {
    bool success = 1;
    string message = 2;
}

message RenameLocalPathRequest {
    string old_name = 1;
    string new_name = 2;
    string path_type = 3;
}

message RenameLocalPathResponse {
    bool success = 1;
    string message = 2;
}
