version: '3'

includes:
  common: ../Taskfile.yml

tasks:
  build:
    summary: Builds the application for Windows
    deps:
      - task: common:go:mod:tidy
      - task: common:build:frontend
      - task: common:generate:icons
    vars:
      BUILD_VERSION: '{{.BUILD_VERSION | default "0.0.0-local-dev"}}'
    cmds:
      - task: generate:syso
        vars:
          BUILD_VERSION: '{{.BUILD_VERSION}}'
      - 'go build -tags devtools -trimpath -buildvcs=false -ldflags="-w -s -H windowsgui -X main.version=v{{.BUILD_VERSION}}" -o "{{.BIN_DIR}}/{{.APP_NAME}}.exe"'
      - powershell Remove-item *.syso
    env:
      GOOS: windows
      CGO_ENABLED: 0
      GOARCH: '{{.ARCH | default ARCH}}'

  build:cli:
    summary: Builds the bundled CLI daemon (filemoverexpress.exe) for Windows
    cmds:
      # The Windows app is a three-binary bundle: the GUI spawns the launcher, which runs
      # `filemoverexpress.exe daemon`. Build the CLI daemon so the installer can bundle it.
      - go build -C ../cli -trimpath -ldflags "-s -w -X main.Version=v${BUILD_VERSION:-0.0.0-local-dev}" -o ../../dist/filemoverexpress.exe main.go
    env:
      GOOS: windows
      CGO_ENABLED: '0'
      GOARCH: '{{.ARCH | default ARCH}}'

  build:launcher:
    summary: Builds the Windows daemon launcher (filemoverexpress-launcher.exe)
    cmds:
      # The launcher is a separate Go module (src/windows-daemon-launcher). The GUI runs
      # it (see daemon_windows.go), and it in turn starts filemoverexpress.exe.
      - go build -C ../windows-daemon-launcher -trimpath -ldflags "-s -w" -o ../../dist/filemoverexpress-launcher.exe
    env:
      GOOS: windows
      CGO_ENABLED: '0'
      GOARCH: '{{.ARCH | default ARCH}}'

  package:
    summary: Packages the application into an NSIS installer (GUI + launcher + CLI daemon)
    deps:
      - task: build
      - task: build:cli
      - task: build:launcher
    cmds:
      - task: create:nsis:installer

  generate:syso:
    summary: Generates the Windows .syso version resource
    # Uses the local gen-syso helper instead of `wails3 generate syso`. On the pinned
    # tc-hib/winres v0.3.1, a VERSIONINFO built only via version.Info.UnmarshalJSON (what
    # `wails3 generate syso` does) serializes a string table the Win32 version API reads
    # back empty, so the taskbar/Properties show no ProductName. The helper re-applies the
    # strings under en-US and calls SetFileVersion/SetProductVersion, which winres requires
    # for the resource to be readable. See build/windows/gen-syso/main.go.
    dir: build
    vars:
      # Strip the ldflags-style 'v' prefix and any pre-release suffix so the version
      # resource carries a clean dotted version (e.g. 1.2.3). Falls back to info.json
      # when unset. This is a POSIX-shell expansion, matched by the bash cmds below.
      SYSO_VERSION: '{{.BUILD_VERSION | default ""}}'
    cmds:
      - |
        set -euo pipefail
        RAW="{{.SYSO_VERSION}}"
        CLEAN="${RAW#v}"        # drop a leading 'v'
        CLEAN="${CLEAN%%-*}"    # drop a -local-dev / -rc.N suffix
        go run ./windows/gen-syso \
          -arch "{{.ARCH | default ARCH}}" \
          -icon windows/icon.ico \
          -manifest windows/wails.exe.manifest \
          -info windows/info.json \
          -version "${CLEAN}" \
          -out "../wails_windows_{{.ARCH | default ARCH}}.syso"

  create:nsis:installer:
    summary: Creates an NSIS installer bundling the GUI, launcher, and CLI daemon
    # The NSIS sources live in build/windows/installer (relative to src/wails). makensis
    # must run from that dir so project.nsi's relative `File "tmp\..."` (the WebView2
    # bootstrapper) and `OutFile "..\..\bin\..."` resolve correctly.
    dir: build/windows/installer
    cmds:
      - |
        set -euo pipefail
        # dist/ relative to this dir (installer is 5 levels below the repo root). Use a
        # forward-slash RELATIVE path for shell ops (cp/mv/rm) — the shell handles those
        # fine on Windows, whereas an absolute path from `pwd` comes back as a native
        # Windows path with mixed separators that NSIS `File` can't resolve.
        DIST_REL="../../../../../dist"
        GOARCH_TARGET="{{.ARCH | default ARCH}}"
        # project.nsi picks the binary define + the ${ARCH} filename token by GOARCH.
        if [ "$GOARCH_TARGET" = "arm64" ]; then
          BIN_DEFINE="ARG_WAILS_ARM64_BINARY"
        else
          BIN_DEFINE="ARG_WAILS_AMD64_BINARY"
        fi
        # Generate the WebView2 bootstrapper into ./tmp so project.nsi's
        # `File "tmp\MicrosoftEdgeWebview2Setup.exe"` (relative to makensis cwd) resolves.
        # (`-dir .` drops it in the cwd, where the NSIS macro can't find it.)
        mkdir -p tmp
        # project.nsi's OutFile writes to ../../bin (src/wails/build/bin), which is
        # gitignored and absent in a fresh checkout — create it so NSIS can write there.
        mkdir -p ../../bin
        wails3 generate webview2bootstrapper -dir tmp
        # Copy the three binaries next to project.nsi and reference them by BARE FILENAME.
        # NSIS `File` resolves relative to its cwd (this dir) and wants backslash paths;
        # passing an absolute mixed-separator path (D:\a\...\repo/dist/x.exe) fails with
        # "no files found". Bare filenames in the cwd sidestep the separator problem.
        cp "${DIST_REL}/{{.APP_NAME}}.exe" .
        cp "${DIST_REL}/filemoverexpress-launcher.exe" .
        cp "${DIST_REL}/filemoverexpress.exe" .
        # wails_tools.nsh is a Wails Go-template whose INFO_* defaults are unrendered
        # placeholders ("{{.Info.ProductVersion}}" etc.) in this build flow, which makes
        # VIFileVersion invalid. Pass concrete values (from build/config.yml + info.json)
        # so the !ifndef defaults are never used. INFO_PROJECTNAME drives the OutFile name
        # (-> "filemoverexpress-${ARCH}-installer.exe", matched and renamed to the published
        # asset name by the mv below); it is intentionally decoupled from the executable,
        # which is set explicitly to "{{.APP_NAME}}.exe" via PRODUCT_EXECUTABLE below.
        makensis \
          "-DINFO_PROJECTNAME=filemoverexpress" \
          "-DINFO_COMPANYNAME=Amazon Web Services" \
          "-DINFO_PRODUCTNAME=File Mover Express" \
          "-DINFO_PRODUCTVERSION=1.0.0" \
          "-DINFO_COPYRIGHT=Amazon Web Services, 2026" \
          "-D${BIN_DEFINE}={{.APP_NAME}}.exe" \
          "-DARG_FME_LAUNCHER_BINARY=filemoverexpress-launcher.exe" \
          "-DARG_FME_CLI_BINARY=filemoverexpress.exe" \
          project.nsi
        # Remove the local copies; project.nsi writes the installer to ../../bin
        # (src/wails/build/bin) relative to cwd. Move it into dist/ (generate-installer
        # globs dist/*.exe) and drop the intermediate binaries so the published artifact
        # contains ONLY the installer.
        rm -f "{{.APP_NAME}}.exe" filemoverexpress-launcher.exe filemoverexpress.exe
        # Rename to the published asset name while moving: the "windows" token makes the
        # asset self-describing next to the .dmg files in the release list. Done here (not
        # via INFO_PROJECTNAME) so NSIS-internal names (registry keys, install dir) keep
        # the plain project name.
        mv "../../bin/filemoverexpress-${GOARCH_TARGET}-installer.exe" "${DIST_REL}/filemoverexpress-windows-${GOARCH_TARGET}-installer.exe"
        rm -f "${DIST_REL}/{{.APP_NAME}}.exe" "${DIST_REL}/filemoverexpress-launcher.exe" "${DIST_REL}/filemoverexpress.exe"
        echo "Installer -> dist/filemoverexpress-windows-${GOARCH_TARGET}-installer.exe"

  run:
    cmds:
      - '{{.BIN_DIR}}/{{.APP_NAME}}.exe'
