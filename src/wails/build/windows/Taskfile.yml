version: '3'

includes:
  common: ../Taskfile.yml

tasks:
  build:
    summary: Builds the application for Windows
    deps:
      - task: common:go:mod:tidy
      - task: common:build:frontend
      - task: common:generate:icons
    cmds:
      - task: generate:syso
      - 'go build -tags devtools -trimpath -buildvcs=false -ldflags="-w -s -H windowsgui" -o "{{.BIN_DIR}}/{{.APP_NAME}}.exe"'
      - powershell Remove-item *.syso
    env:
      GOOS: windows
      CGO_ENABLED: 0
      GOARCH: '{{.ARCH | default ARCH}}'

  build:cli:
    summary: Builds the bundled CLI daemon (filemoverexpress.exe) for Windows
    cmds:
      # The Windows app is a three-binary bundle: the GUI spawns the launcher, which runs
      # `filemoverexpress.exe daemon`. Build the CLI daemon so the installer can bundle it.
      - go build -C ../cli -trimpath -ldflags "-s -w -X main.Version=v${BUILD_VERSION:-0.0.0-local-dev}" -o ../../dist/filemoverexpress.exe main.go
    env:
      GOOS: windows
      CGO_ENABLED: '0'
      GOARCH: '{{.ARCH | default ARCH}}'

  build:launcher:
    summary: Builds the Windows daemon launcher (filemoverexpress-launcher.exe)
    cmds:
      # The launcher is a separate Go module (src/windows-daemon-launcher). The GUI runs
      # it (see daemon_windows.go), and it in turn starts filemoverexpress.exe.
      - go build -C ../windows-daemon-launcher -trimpath -ldflags "-s -w" -o ../../dist/filemoverexpress-launcher.exe
    env:
      GOOS: windows
      CGO_ENABLED: '0'
      GOARCH: '{{.ARCH | default ARCH}}'

  package:
    summary: Packages the application into an NSIS installer (GUI + launcher + CLI daemon)
    deps:
      - task: build
      - task: build:cli
      - task: build:launcher
    cmds:
      - task: create:nsis:installer

  generate:syso:
    summary: Generates Windows .syso file
    dir: build
    cmds:
      - 'wails3 generate syso -arch {{.ARCH | default ARCH}} -icon windows/icon.ico -manifest windows/wails.exe.manifest -info windows/info.json -out ../wails_windows_{{.ARCH | default ARCH}}.syso'

  create:nsis:installer:
    summary: Creates an NSIS installer bundling the GUI, launcher, and CLI daemon
    # The NSIS sources live in build/windows/installer (relative to src/wails). makensis
    # must run from that dir so project.nsi's relative `File "tmp\..."` (the WebView2
    # bootstrapper) and `OutFile "..\..\bin\..."` resolve correctly.
    dir: build/windows/installer
    cmds:
      - |
        set -euo pipefail
        # Resolve the repo-root dist/ dir (installer is 5 levels below the repo root).
        DIST="$(cd ../../../../.. && pwd)/dist"
        GOARCH_TARGET="{{.ARCH | default ARCH}}"
        # project.nsi picks the binary define + the ${ARCH} filename token by GOARCH.
        if [ "$GOARCH_TARGET" = "arm64" ]; then
          BIN_DEFINE="ARG_WAILS_ARM64_BINARY"
        else
          BIN_DEFINE="ARG_WAILS_AMD64_BINARY"
        fi
        # Generate the WebView2 bootstrapper into this dir so project.nsi's
        # `File "tmp\MicrosoftEdgeWebview2Setup.exe"` (relative to makensis cwd) resolves.
        wails3 generate webview2bootstrapper -dir .
        # wails_tools.nsh is a Wails Go-template whose INFO_* defaults are unrendered
        # placeholders ("{{.Info.ProductVersion}}" etc.) in this build flow, which makes
        # VIFileVersion invalid. Pass concrete values (from build/config.yml + info.json)
        # so the !ifndef defaults are never used. INFO_PROJECTNAME must equal APP_NAME so
        # OutFile is "{{.APP_NAME}}-${ARCH}-installer.exe" (matched by the mv below) and
        # PRODUCT_EXECUTABLE defaults to "{{.APP_NAME}}.exe".
        makensis \
          "-DINFO_PROJECTNAME={{.APP_NAME}}" \
          "-DINFO_COMPANYNAME=Amazon Web Services" \
          "-DINFO_PRODUCTNAME=File Mover Express for AWS" \
          "-DINFO_PRODUCTVERSION=1.0.0" \
          "-DINFO_COPYRIGHT=Amazon Web Services, 2026" \
          "-D${BIN_DEFINE}=${DIST}/{{.APP_NAME}}.exe" \
          "-DARG_FME_LAUNCHER_BINARY=${DIST}/filemoverexpress-launcher.exe" \
          "-DARG_FME_CLI_BINARY=${DIST}/filemoverexpress.exe" \
          project.nsi
        # project.nsi writes the installer to ../../bin (src/wails/build/bin) relative to
        # cwd. Move it into dist/ (generate-installer globs dist/*.exe) and drop the
        # intermediate binaries so the published artifact contains ONLY the installer.
        INSTALLER="../../bin/{{.APP_NAME}}-${GOARCH_TARGET}-installer.exe"
        mv "${INSTALLER}" "${DIST}/"
        rm -f "${DIST}/{{.APP_NAME}}.exe" "${DIST}/filemoverexpress-launcher.exe" "${DIST}/filemoverexpress.exe"
        echo "Installer -> ${DIST}/{{.APP_NAME}}-${GOARCH_TARGET}-installer.exe"

  run:
    cmds:
      - '{{.BIN_DIR}}/{{.APP_NAME}}.exe'
