version: '3'

vars:
  APP_NAME: "FileMoverExpressUI"
  BIN_DIR: "../../dist"
  VITE_PORT: '{{.WAILS_VITE_PORT | default 4200}}'
  BUILD_VERSION: '{{.BUILD_VERSION | default "0.0.0-local-dev"}}'

includes:
  common: ./build/Taskfile.yml
  windows:
    taskfile: ./build/windows/Taskfile.yml
    vars:
      BUILD_VERSION: '{{.BUILD_VERSION}}'
  darwin:
    taskfile: ./build/darwin/Taskfile.yml
    vars:
      BUILD_VERSION: '{{.BUILD_VERSION}}'
  linux:
    taskfile: ./build/linux/Taskfile.yml
    vars:
      BUILD_VERSION: '{{.BUILD_VERSION}}'

tasks:
  build:
    summary: Builds the application
    cmds:
      - task: "{{OS}}:build"

  package:
    summary: Packages a production build of the application
    cmds:
      - task: "{{OS}}:package"

  run:
    summary: Runs the application
    cmds:
      - task: "{{OS}}:run"

  dev:
    summary: Runs the application in development mode
    cmds:
      - wails3 dev -config ./build/config.yml -port {{.VITE_PORT}}

  test:
    desc: Run Wails Go tests
    cmds:
      - go test -gcflags="all=-N -l" -short -v -cover -coverprofile coverage.out ./...
      - go tool cover -html coverage.out -o coverage.html

  # Uses the repository's .golangci.yml, which golangci-lint finds by walking up from this
  # directory, so this module and src/cli follow one set of rules. The server tag builds the app
  # without the native window (no CGO or GTK needed), so the same command lints on any host. It
  # runs once per target OS so the platform-specific files (_darwin.go, _windows.go, _unix.go) are
  # all checked. main.go embeds the GUI build; an empty placeholder keeps the package compiling
  # before the GUI has been built.
  lint:
    desc: Run golangci-lint for Linux, macOS, and Windows
    cmds:
      - mkdir -p frontend/dist/browser
      - touch frontend/dist/browser/.gitkeep
      - for: [linux, darwin, windows]
        cmd: GOOS={{.ITEM}} golangci-lint run --build-tags server,production {{.CLI_ARGS}}
    env:
      CGO_ENABLED: '0'
