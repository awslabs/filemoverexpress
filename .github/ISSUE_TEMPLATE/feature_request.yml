---
name: "🚀 Feature Request"
description: Suggest a new feature or improvement
title: "[Feature]: (short description)"
labels: [feature-request, needs-triage]
assignees: []
body:
  - type: textarea
    id: description
    attributes:
      label: Describe the feature
      description: A clear and concise description of the feature you are proposing.
    validations:
      required: true

  - type: textarea
    id: use-case
    attributes:
      label: Use case
      description: |
        Why do you need this feature? For example: "I'm always frustrated when..." or "My workflow requires..."
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of File Mover Express does this relate to?
      multiple: true
      options:
        - GUI (Desktop App)
        - CLI
        - Transfers / Performance
        - Hot Folders
        - Checksums / Integrity
        - Configuration
        - Documentation
        - Build / Packaging
        - Other
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: |
        If you have an idea for how this could be implemented, describe it here. Sketches, mockups, or references to similar features in other tools are welcome.
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: |
        Have you considered any workarounds or alternative approaches?
    validations:
      required: false

  - type: checkboxes
    id: ack
    attributes:
      label: Acknowledgements
      options:
        - label: I have searched existing issues to verify this is not a duplicate
          required: true
        - label: I may be able to implement this feature
          required: false
        - label: This feature might incur a breaking change
          required: false

