name: 'Setup Environment'
description: 'Provision runner with Node.js, Go, Task, and workspace dependencies'

inputs:
  node-version:
    description: 'Node.js version to install on the runner'
    required: false
    default: '25'
  go-version:
    description: 'Go version to install on the runner'
    required: false
    default: '1.25'
  install-go:
    description: 'Whether to install the Go toolchain'
    required: false
    default: 'true'
  force-container-mode:
    description: 'Skip tool installations regardless of container detection'
    required: false
    default: 'false'
  wails-version:
    description: 'Wails v3 version to install'
    required: false
    default: 'v3.0.0-alpha2.108'
  working-directory:
    description: 'Working directory for commands'
    required: false
    default: '.'

outputs:
  in-container:
    description: 'Whether the action detected it is running inside a container'
    value: "${{ steps.container-check.outputs.in-container }}"

runs:
  using: composite
  steps:
    - name: Install Linux Dependencies
      id: install-linux-dependencies
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev build-essential

    - name: Check if running in container
      id: container-check
      run: |
        if [ "${{ inputs.force-container-mode }}" = "true" ] || [ -n "$FME_BUILDER_CONTAINER" ]; then
          echo "in-container=true" >> $GITHUB_OUTPUT
        else
          echo "in-container=false" >> $GITHUB_OUTPUT
        fi
      shell: bash

    - name: Install Node.js
      if: steps.container-check.outputs.in-container == 'false'
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: 'npm'
        cache-dependency-path: '**/package-lock.json'

    - name: Install Go
      if: inputs.install-go == 'true' && steps.container-check.outputs.in-container == 'false'
      uses: actions/setup-go@v6
      with:
        go-version: ${{ inputs.go-version }}
        cache-dependency-path: src/cli/go.sum

    - name: Install Task
      if: steps.container-check.outputs.in-container == 'false'
      uses: arduino/setup-task@b91d5d2c96a56797b48ac1e0e89220bf64044611
      with:
        version: 3.x

    - name: Configure Go build cache path
      if: inputs.install-go == 'true'
      run: |
        if [ "$(uname)" = "Darwin" ]; then
          echo "GOFLAGS=-cache=$HOME/Library/Caches/go-build" >> $GITHUB_ENV
          echo "GOCACHE=$HOME/Library/Caches/go-build" >> $GITHUB_ENV
        else
          echo "GOCACHE=$HOME/.cache/go-build" >> $GITHUB_ENV
        fi
      shell: bash

    - name: Install npm dependencies
      run: npm ci
      shell: bash

    - name: Add node_modules/.bin to PATH
      run: echo "${{ github.workspace }}/node_modules/.bin" >> $GITHUB_PATH
      shell: bash

    - name: Install Go protobuf plugins
      if: inputs.install-go == 'true'
      run: |
        go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
        go install connectrpc.com/connect/cmd/protoc-gen-connect-go@latest
      shell: bash

    - name: Install golangci-lint
      if: inputs.install-go == 'true' && steps.container-check.outputs.in-container == 'false'
      run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.1.6
      shell: bash

    - name: Install Wails v3
      if: inputs.install-go == 'true'
      run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ inputs.wails-version }}
      shell: bash
