name: 'Generate Installer'
description: 'Generate platform-specific installer via Electron Forge using pre-built artifacts'

inputs:
  platform:
    description: 'Target platform alias (mac, win, linux)'
    required: true
  architecture:
    description: 'Target architecture (x64, arm64)'
    required: true
  build-version:
    description: 'Version string for installer metadata'
    required: false
    default: ''
  makers:
    description: 'Comma-separated Forge maker types to use'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Download CLI binary
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        name: cli-${{ inputs.platform == 'mac' && 'darwin' || inputs.platform == 'win' && 'windows' || 'linux' }}-${{ inputs.architecture }}
        path: dist/

    - name: Download GUI dist
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        name: gui-dist
        path: src/gui/dist/

    - name: Download Electron dist
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        name: electron-dist
        path: src/electron/dist/

    - name: Generate installer
      run: |
        npx -w @filemoverexpress/build-scripts ts-node build.ts installer ${{ inputs.platform }} \
          --archs ${{ inputs.architecture }} \
          --dev-mode \
          ${{ inputs.build-version && format('--build-version {0}', inputs.build-version) || '' }} \
          ${{ inputs.makers && format('--makers {0}', inputs.makers) || '' }}
      shell: bash

    - name: Upload installer artifact
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: installer-${{ inputs.platform }}-${{ inputs.architecture }}
        path: |
          dist/*.dmg
          dist/*.pkg
          dist/*.exe
          dist/*.msi
          dist/*.deb
          dist/*.rpm
          dist/*.AppImage
          dist/*.zip
        retention-days: 30
