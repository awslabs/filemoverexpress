name: 'Generate Installer'
description: 'Builds and packages the Wails desktop application for the current platform'

inputs:
  platform:
    description: 'Target platform alias (mac, win, linux)'
    required: true
  architecture:
    description: 'Target architecture (x64, arm64)'
    required: true
  build-version:
    description: 'Version string for installer metadata'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Package Wails application
      run: task wails:package
      shell: bash
      env:
        BUILD_VERSION: ${{ inputs.build-version }}

    - name: Upload installer artifact
      uses: actions/upload-artifact@v4 # v4.6.2
      with:
        name: installer-${{ inputs.platform }}-${{ inputs.architecture }}
        path: |
          dist/*.dmg
          dist/*.pkg
          dist/*.app
          dist/*.exe
          dist/*.msi
          dist/*.deb
          dist/*.rpm
          dist/*.AppImage
          dist/*.zip
        retention-days: 30
