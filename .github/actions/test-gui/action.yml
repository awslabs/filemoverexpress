name: 'Test GUI'
description: 'Runs Angular Vitest unit tests for the GUI component via npm run test:gui'

inputs:
  coverage:
    description: 'Generate and upload GUI coverage report'
    required: false
    default: 'true'

runs:
  using: 'composite'
  steps:
    - name: Run GUI tests
      working-directory: src/gui
      run: task test
      shell: bash

    - name: Upload coverage
      if: inputs.coverage == 'true'
      uses: actions/upload-artifact@v4 # v4.6.2
      with:
        name: gui-coverage
        path: src/gui/coverage/
        retention-days: 14
