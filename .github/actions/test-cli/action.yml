name: 'Test CLI'
description: 'Runs Go unit tests for the CLI component'

inputs:
  coverage:
    description: 'Generate and upload Go coverage report'
    required: false
    default: 'true'
  verbose:
    description: 'Enable verbose test output'
    required: false
    default: 'true'

runs:
  using: 'composite'
  steps:
    # The CLI resolves its directory from the account's home (user.Current), not from $HOME. In a
    # container job they differ ($HOME is /github/home, the account's home is /root), so create both.
    - name: Prepare CLI test environment
      run: |
        account_home="$(getent passwd "$(id -u)" | cut -d: -f6)"
        mkdir -p "$HOME/.filemoverexpress" "${account_home:-$HOME}/.filemoverexpress"
      shell: bash

    - name: Run CLI tests
      working-directory: src/cli
      run: task test
      env:
        GOFLAGS: -p=1
      shell: bash

    - name: Upload coverage
      if: inputs.coverage == 'true'
      uses: actions/upload-artifact@v4 # v4.6.2
      with:
        name: cli-coverage
        path: src/cli/coverage.html
        retention-days: 14
