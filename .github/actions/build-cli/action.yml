name: 'Build CLI'
description: 'Builds the Go CLI binary for the current runner platform via Task'

inputs:
  platform:
    description: 'Target platform (darwin, linux, windows)'
    required: true
  architecture:
    description: 'Target architecture (x64, arm64)'
    required: true
  build-version:
    description: 'Semantic version string to embed via ldflags'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Build CLI binary
      working-directory: src/cli
      run: task build
      shell: bash
      env:
        BUILD_VERSION: ${{ inputs.build-version }}

    - name: Upload CLI artifact
      uses: actions/upload-artifact@v4 # v4
      with:
        name: cli-${{ inputs.platform }}-${{ inputs.architecture }}
        path: dist/filemoverexpress*
        retention-days: 7
