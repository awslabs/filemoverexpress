name: 'Build GUI'
description: 'Builds the Angular GUI application for production'

runs:
  using: 'composite'
  steps:
    - name: Build GUI
      working-directory: src/gui
      run: task build
      shell: bash

    - name: Upload GUI dist
      uses: actions/upload-artifact@v4 # v4.6.2
      with:
        name: gui-dist
        path: src/wails/frontend/dist/
        retention-days: 7
