name: 'Build Electron'
description: 'Builds the Electron main process TypeScript via npm run build:electron'

runs:
  using: 'composite'
  steps:
    - name: Build Electron
      run: npm run build:electron
      shell: bash

    - name: Verify Electron build output
      run: |
        if [ -z "$(ls -A src/electron/dist/ 2>/dev/null)" ]; then
          echo "::error::No output files produced in src/electron/dist/"
          exit 1
        fi
      shell: bash

    - name: Upload Electron dist
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: electron-dist
        path: src/electron/dist/
        retention-days: 7
