name: 'Generate Bindings'
description: 'Generates Wails bindings for the frontend'

runs:
  using: 'composite'
  steps:
    - name: Generate Wails bindings
      run: task generate:wails-bindings
      shell: bash

    - name: Upload generated bindings
      uses: actions/upload-artifact@v4 # v4
      with:
        name: wails-bindings
        path: src/gui/src/gen/wails/
        retention-days: 7
