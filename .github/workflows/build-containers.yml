name: Build CI Containers

# Disabled: container builds are not currently used and the Dockerfiles
# reference stale workspace paths that cause failures. Re-enable when the
# Dockerfiles are updated to match the current monorepo layout.
# on:
#   push:
#     branches: [main]
#     paths:
#       - '.github/docker/**'
#       - 'package-lock.json'
#       - 'src/*/package.json'
#   workflow_dispatch:
on: workflow_dispatch

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - dockerfile: .github/docker/fme-builder.Dockerfile
            # TODO: Change tag before publishing
            tag: containers.lax.bunjiboys.dk/awslabs/fme-builder:latest
            platform: linux/amd64
          - dockerfile: .github/docker/fme-builder-arm64.Dockerfile
            tag: containers.lax.bunjiboys.dk/awslabs/fme-builder-arm64:latest
            platform: linux/arm64
    steps:
      - uses: actions/checkout@v4 # v4
#      - uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3
#        with:
#          registry: ghcr.io
#          username: ${{ github.actor }}
#          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ matrix.tag }}
          platforms: ${{ matrix.platform }}
