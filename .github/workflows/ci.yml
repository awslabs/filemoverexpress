name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  generate-protobuf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # v4
      - uses: ./.github/actions/setup-environment
        with:
          working-directory: src/protobuf
      - uses: ./.github/actions/generate-protobuf

  generate-bindings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # v4
      - uses: ./.github/actions/setup-environment
      - uses: ./.github/actions/generate-bindings

  lint:
    needs: [generate-protobuf, generate-bindings]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # v4
      - uses: ./.github/actions/setup-environment
      - uses: ./.github/actions/download-protobuf
      - uses: ./.github/actions/download-bindings
      - uses: ./.github/actions/lint-gui
      - uses: ./.github/actions/lint-cli
      - uses: ./.github/actions/lint-protobuf

  test-cli:
    needs: [generate-protobuf, generate-bindings]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # v4
      - uses: ./.github/actions/setup-environment
      - uses: ./.github/actions/download-protobuf
      - uses: ./.github/actions/download-bindings
      - uses: ./.github/actions/test-cli

  test-gui:
    needs: [generate-protobuf, generate-bindings]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # v4
      - uses: ./.github/actions/setup-environment
        with:
          install-go: 'false'
      - uses: ./.github/actions/download-protobuf
      - uses: ./.github/actions/download-bindings
      - uses: ./.github/actions/test-gui

  test-wails:
    needs: [generate-protobuf, generate-bindings]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # v4
      - uses: ./.github/actions/setup-environment
      - uses: ./.github/actions/download-protobuf
      - uses: ./.github/actions/download-bindings
      - name: Create dummy frontend dist for embedFS
        run: mkdir -p src/wails/frontend/dist/browser && touch src/wails/frontend/dist/browser/.gitkeep
        shell: bash
      - name: Run Wails tests
        run: task wails:test
