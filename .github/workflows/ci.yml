name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # Finds the prebuilt CI image that matches this checkout (see .github/docker/ and
  # build-containers.yml). When it has not been published yet, for example in a pull request
  # that changes the image inputs, `ci-image` is empty: the jobs below then run directly on the
  # runner and install the toolchain with setup-environment, exactly as they did before.
  resolve-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      ci-image: ${{ steps.resolve.outputs.ci-image }}
      ci-container: ${{ steps.resolve.outputs.ci-container }}
      e2e-image: ${{ steps.resolve.outputs.e2e-image }}
      e2e-container: ${{ steps.resolve.outputs.e2e-container }}
    steps:
      - uses: actions/checkout@v4 # v4
      - id: resolve
        uses: ./.github/actions/resolve-image

  lint:
    needs: [resolve-image]
    runs-on: ubuntu-latest
    container: ${{ fromJSON(needs.resolve-image.outputs.ci-container) }}
    steps:
      - uses: actions/checkout@v4 # v4
      - uses: ./.github/actions/setup-environment
        with:
          force-container-mode: ${{ needs.resolve-image.outputs.ci-image != '' }}
      - name: Generate protobuf and Wails bindings
        run: task generate
        shell: bash
      - uses: ./.github/actions/lint-gui
      - uses: ./.github/actions/lint-cli
      - uses: ./.github/actions/lint-protobuf

  test-cli:
    needs: [resolve-image]
    runs-on: ubuntu-latest
    container: ${{ fromJSON(needs.resolve-image.outputs.ci-container) }}
    steps:
      - uses: actions/checkout@v4 # v4
      - uses: ./.github/actions/setup-environment
        with:
          force-container-mode: ${{ needs.resolve-image.outputs.ci-image != '' }}
      - name: Generate protobuf code
        run: task proto:generate
        shell: bash
      - uses: ./.github/actions/test-cli

  test-gui:
    needs: [resolve-image]
    runs-on: ubuntu-latest
    container: ${{ fromJSON(needs.resolve-image.outputs.ci-container) }}
    steps:
      - uses: actions/checkout@v4 # v4
      - uses: ./.github/actions/setup-environment
        with:
          force-container-mode: ${{ needs.resolve-image.outputs.ci-image != '' }}
      - name: Generate protobuf and Wails bindings
        run: task generate
        shell: bash
      - uses: ./.github/actions/test-gui

  test-wails:
    needs: [resolve-image]
    runs-on: ubuntu-latest
    container: ${{ fromJSON(needs.resolve-image.outputs.ci-container) }}
    steps:
      - uses: actions/checkout@v4 # v4
      - uses: ./.github/actions/setup-environment
        with:
          force-container-mode: ${{ needs.resolve-image.outputs.ci-image != '' }}
      - name: Generate protobuf code
        run: task proto:generate
        shell: bash
      - name: Create dummy frontend dist for embedFS
        run: mkdir -p src/wails/frontend/dist/browser && touch src/wails/frontend/dist/browser/.gitkeep
        shell: bash
      - name: Run Wails tests
        run: task wails:test
        shell: bash

  # Needs the end-to-end image (AWS Emulator is installed there). Skipped, not failed, while that image
  # is not published, for example in a pull request that changes the image inputs.
  e2e:
    needs: [resolve-image]
    if: needs.resolve-image.outputs.e2e-image != ''
    runs-on: ubuntu-latest
    container: ${{ fromJSON(needs.resolve-image.outputs.e2e-container) }}
    steps:
      - uses: actions/checkout@v4 # v4
      - uses: ./.github/actions/setup-environment
        with:
          force-container-mode: true
      - name: Generate protobuf and Wails bindings
        run: task generate
        shell: bash
      - name: Prepare home directory
        run: mkdir -p "$HOME/.filemoverexpress"
        shell: bash
      - name: Run daemon end-to-end tests
        run: task cli:e2e
        shell: bash
      - name: Run GUI end-to-end tests
        # Runs even when the daemon suite failed, so both results are reported.
        if: ${{ !cancelled() }}
        run: task gui:e2e
        shell: bash
        env:
          CI: 'true'
      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4 # v4.6.2
        with:
          name: playwright-report
          path: |
            src/gui/e2e/playwright-report/
            src/gui/e2e/test-results/
          retention-days: 14
