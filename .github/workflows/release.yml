name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (semver format, e.g., 1.2.3)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  generate-protobuf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # v4
      - uses: ./.github/actions/setup-environment
        with:
          working-directory: src/protobuf
      - uses: ./.github/actions/generate-protobuf

  generate-bindings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # v4
      - uses: ./.github/actions/setup-environment
      - uses: ./.github/actions/generate-bindings

  generate-installer:
    needs: [generate-protobuf, generate-bindings]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: mac
            architecture: x64
            runner: macos-15-intel
          - platform: mac
            architecture: arm64
            runner: macos-latest
          - platform: win
            architecture: x64
            runner: windows-latest
          - platform: win
            architecture: arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4 # v4
      - uses: ./.github/actions/setup-environment
      - uses: ./.github/actions/download-protobuf
      - uses: ./.github/actions/download-bindings
      - uses: ./.github/actions/generate-installer
        with:
          platform: ${{ matrix.platform }}
          architecture: ${{ matrix.architecture }}
          build-version: ${{ inputs.version || github.ref_name }}

  # ---------------------------------------------------------------------------
  # MCP server binary build (fme-mcp)
  #
  # Builds the standalone MCP server binary for all platforms. macOS and Windows
  # binaries are fed into the signing chains below.
  # ---------------------------------------------------------------------------
  build-mcp:
    needs: [generate-protobuf]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: mac
            architecture: x64
            runner: macos-15-intel
            goos: darwin
            goarch: amd64
          - platform: mac
            architecture: arm64
            runner: macos-latest
            goos: darwin
            goarch: arm64
          - platform: win
            architecture: x64
            runner: windows-latest
            goos: windows
            goarch: amd64
          - platform: linux
            architecture: x64
            runner: ubuntu-latest
            goos: linux
            goarch: amd64
          - platform: linux
            architecture: arm64
            runner: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-environment
      - uses: ./.github/actions/download-protobuf
      - name: Build fme-mcp
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          BUILD_VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          cd src/cli
          CGO_ENABLED=0 go build -trimpath \
            -ldflags "-s -w -X \"main.Version=v${BUILD_VERSION}\"" \
            -o "../../dist/fme-mcp${{ matrix.goos == 'windows' && '.exe' || '' }}" \
            mcp-main.go
      - uses: actions/upload-artifact@v4
        with:
          name: mcp-${{ matrix.platform }}-${{ matrix.architecture }}
          path: dist/fme-mcp*
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Headless CLI daemon build (filemoverexpress)
  #
  # Builds the standalone CLI daemon binary for Linux only. Linux is not shipped
  # as a desktop GUI (native WebKitGTK dependencies, no signing); Linux users run
  # the headless daemon on servers, render farms, and cloud instances, and drive
  # it from a GUI on another machine over the remote-daemon connection. The macOS
  # and Windows desktop installers already bundle this same daemon, so it is only
  # published standalone for Linux. The binary is pure Go (CGO_ENABLED=0) and
  # cross-compiles cleanly, exactly like fme-mcp above. Linux artifacts are
  # unsigned, so each leg builds straight to its final release asset name and
  # create-release publishes it as-is (no rename/sign step). The asset names match
  # what docs/Headless-Linux-Installation.md tells users to download.
  # ---------------------------------------------------------------------------
  build-cli:
    needs: [generate-protobuf]
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-latest
          - architecture: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-environment
      - uses: ./.github/actions/download-protobuf
      - name: Build filemoverexpress CLI daemon
        shell: bash
        env:
          GOOS: linux
          GOARCH: ${{ matrix.architecture }}
          BUILD_VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          cd src/cli
          CGO_ENABLED=0 go build -trimpath \
            -ldflags "-s -w -X \"main.Version=v${BUILD_VERSION}\"" \
            -o "../../dist/filemoverexpress-linux-${{ matrix.architecture }}" \
            main.go
      - uses: actions/upload-artifact@v4
        with:
          name: cli-linux-${{ matrix.architecture }}
          path: dist/filemoverexpress-linux-*
          retention-days: 30

  # ---------------------------------------------------------------------------
  # macOS code signing (CD Signer) + notarization (Apple notary)
  #
  # Gated behind the `MACOS_SIGNING_ENABLED` repository variable so releases keep
  # working before CD Signer onboarding + the `signing` environment secrets/vars
  # are in place. Set the variable to 'true' (and configure the secrets/vars
  # documented in sign-macos.yml / notarize-macos.yml) to activate the chain:
  #   build (.app) -> sign-macos (CD Signer -> signed .dmg) -> notarize-macos.
  # ---------------------------------------------------------------------------
  sign-macos:
    needs: [generate-installer]
    # Run whenever the workflow isn't cancelled (not only on full matrix success):
    # generate-installer is a matrix, so one failing platform leg would otherwise skip
    # this. The per-arch "download unsigned .app" step is the real guard — an arch whose
    # build didn't produce an installer fails there, while built arches still sign.
    if: ${{ !cancelled() && vars.MACOS_SIGNING_ENABLED == 'true' }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        architecture: [x64, arm64]
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/sign-macos.yml
    with:
      artifact-name: installer-mac-${{ matrix.architecture }}
      app-name: FileMoverExpressUI
      display-name: File Mover Express
      # dmg-basename controls the published asset filename. The "macos" token is
      # human-facing (these installers are downloaded by people, not OS-detecting
      # scripts); the script-fetched MCP/CLI binaries keep Go GOOS tokens (darwin,
      # linux) - see the rename step in create-release.
      dmg-basename: filemoverexpress-macos
      arch: ${{ matrix.architecture }}
    # Pass only the secrets sign-macos.yml declares (not `secrets: inherit`, which would
    # forward every repo/env secret to the reusable workflow).
    secrets:
      AWS_MACOS_SIGNING_ROLE_ARN: ${{ secrets.AWS_MACOS_SIGNING_ROLE_ARN }}
      CD_SIGNER_BUCKET_ACCESS_ROLE: ${{ secrets.CD_SIGNER_BUCKET_ACCESS_ROLE }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

  notarize-macos:
    needs: [sign-macos]
    if: ${{ !cancelled() && vars.MACOS_SIGNING_ENABLED == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        architecture: [x64, arm64]
    permissions:
      contents: read
    uses: ./.github/workflows/notarize-macos.yml
    with:
      signed-artifact-name: signed-installer-mac-${{ matrix.architecture }}
      dmg-filename: filemoverexpress-macos-${{ matrix.architecture }}.dmg
    # Pass only the secrets notarize-macos.yml declares (not `secrets: inherit`).
    secrets:
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

  # ---------------------------------------------------------------------------
  # MCP server macOS code signing (CD Signer, executables path)
  #
  # Signs the standalone fme-mcp binary using the same CD Signer infrastructure as
  # the main app. Uses the executables path (bare Mach-O, not a .app bundle) with
  # identifier com.amazon.filemoverexpress.mcp.
  #
  # Gated behind `MCP_SIGNING_ENABLED` (separate from MACOS_SIGNING_ENABLED) because
  # the MCP bundle ID requires its own signing permissions in the CD Signer bindle.
  # Set the variable to 'true' once the permissions are granted.
  # ---------------------------------------------------------------------------
  sign-mcp-macos:
    needs: [build-mcp]
    if: ${{ !cancelled() && vars.MCP_SIGNING_ENABLED == 'true' }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        architecture: [x64, arm64]
    runs-on: macos-15
    timeout-minutes: 30
    environment: signing
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: ${{ vars.CD_SIGNER_REGION }}
      CD_SIGNER_API_BASE_URL: ${{ vars.CD_SIGNER_API_BASE_URL }}
      SIGNING_BUCKET: ${{ vars.MACOS_SIGNING_BUCKET }}
      BUNDLE_ID: ${{ vars.MACOS_BUNDLE_ID }}
      BUCKET_ACCESS_ROLE: ${{ secrets.CD_SIGNER_BUCKET_ACCESS_ROLE }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ARCH: ${{ matrix.architecture }}
    steps:
      - uses: actions/checkout@v4

      - name: Download unsigned fme-mcp
        uses: actions/download-artifact@v4
        with:
          name: mcp-mac-${{ matrix.architecture }}
          path: ./unsigned

      - name: Set up Python for SigV4 signing
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install signing dependencies
        run: |
          set -euo pipefail
          brew install gnu-tar
          python3 -m pip install requests botocore

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_MACOS_SIGNING_ROLE_ARN }}
          aws-region: ${{ vars.CD_SIGNER_REGION }}

      - name: Sign fme-mcp via CD Signer (executables path)
        run: ./.github/workflows/scripts/sign-mcp-macos.sh

      - name: Upload signed fme-mcp
        uses: actions/upload-artifact@v4
        with:
          name: signed-mcp-mac-${{ matrix.architecture }}
          path: signed-fme-mcp
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Windows code signing (AWS Code Signer / Wallaby, Authenticode)
  #
  # Gated behind the `WINDOWS_SIGNING_ENABLED` repository variable so releases keep
  # working before the `signing` environment secret/vars are in place. Set the variable
  # to 'true' (and configure AWS_SIGNING_ROLE_ARN + AWS_SIGNING_ACCOUNT_ID +
  # AWS_SIGNING_REGION, documented in sign-windows.yml) to activate signing the NSIS
  # installer .exe via the S3-bridge.
  #
  # architecture is the build matrix label (x64/arm64); nsis-arch is the token the
  # NSIS installer filename uses (amd64/arm64, chosen by GOARCH in the Windows Taskfile).
  # ---------------------------------------------------------------------------
  sign-windows:
    needs: [generate-installer]
    # Same rationale as sign-macos: run whenever not cancelled so a failing non-Windows
    # matrix leg doesn't skip this; the per-arch "download unsigned .exe" step is the guard.
    if: ${{ !cancelled() && vars.WINDOWS_SIGNING_ENABLED == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x64
            nsis-arch: amd64
          - architecture: arm64
            nsis-arch: arm64
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/sign-windows.yml
    with:
      artifact-name: installer-win-${{ matrix.architecture }}
      exe-filename: filemoverexpress-windows-${{ matrix.nsis-arch }}-installer.exe
    # Pass only the secret sign-windows.yml declares (not `secrets: inherit`).
    secrets:
      AWS_SIGNING_ROLE_ARN: ${{ secrets.AWS_SIGNING_ROLE_ARN }}

  # ---------------------------------------------------------------------------
  # MCP server Windows code signing (Wallaby / AWS Code Signer, Authenticode)
  #
  # Reuses the existing sign-windows.yml reusable workflow. Signs fme-mcp.exe using the
  # same Authenticode profile as the main installer.
  #
  # Gated behind `MCP_SIGNING_ENABLED` (separate from WINDOWS_SIGNING_ENABLED) because
  # the MCP signing profile may require separate permissions. Set the variable to 'true'
  # once the permissions are granted.
  # ---------------------------------------------------------------------------
  sign-mcp-windows:
    needs: [build-mcp]
    if: ${{ !cancelled() && vars.MCP_SIGNING_ENABLED == 'true' }}
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/sign-windows.yml
    with:
      artifact-name: mcp-win-x64
      exe-filename: fme-mcp.exe
    secrets:
      AWS_SIGNING_ROLE_ARN: ${{ secrets.AWS_SIGNING_ROLE_ARN }}

  # ---------------------------------------------------------------------------
  # Create GitHub Release
  #
  # Collects all signed (or unsigned fallback) artifacts and publishes them as a
  # GitHub Release. Runs even if some upstream jobs fail (Linux installer builds
  # require native dependencies unavailable on CI runners; signing may be disabled).
  #
  # Included assets:
  #   - macOS desktop app (.dmg): notarized > signed > unsigned, per arch
  #   - Windows installer (.exe): signed > unsigned, per arch
  #   - MCP server binaries: signed where available, unsigned for Linux
  #
  # NOT included: Linux desktop installers (require source-code build with
  # CGo/webkit dependencies not available on CI runners).
  # ---------------------------------------------------------------------------
  create-release:
    needs:
      - generate-installer
      - build-mcp
      - build-cli
      - notarize-macos
      - sign-macos
      - sign-windows
      - sign-mcp-macos
      - sign-mcp-windows
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepare release directory
        run: mkdir -p release-assets

      # ----- macOS desktop app (prefer notarized > signed > unsigned) -----
      - name: Download notarized macOS x64 .dmg
        id: notarized-mac-x64
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: notarized-signed-installer-mac-x64
          path: release-assets

      - name: Download signed macOS x64 .dmg (fallback)
        if: steps.notarized-mac-x64.outcome != 'success'
        id: signed-mac-x64
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: signed-installer-mac-x64
          path: release-assets

      - name: Download notarized macOS arm64 .dmg
        id: notarized-mac-arm64
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: notarized-signed-installer-mac-arm64
          path: release-assets

      - name: Download signed macOS arm64 .dmg (fallback)
        if: steps.notarized-mac-arm64.outcome != 'success'
        id: signed-mac-arm64
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: signed-installer-mac-arm64
          path: release-assets

      # ----- Windows installer (prefer signed > unsigned) -----
      - name: Download signed Windows x64 installer
        id: signed-win-x64
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: signed-installer-win-x64
          path: release-assets

      - name: Download unsigned Windows x64 installer (fallback)
        if: steps.signed-win-x64.outcome != 'success'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: installer-win-x64
          path: release-assets

      - name: Download signed Windows arm64 installer
        id: signed-win-arm64
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: signed-installer-win-arm64
          path: release-assets

      - name: Download unsigned Windows arm64 installer (fallback)
        if: steps.signed-win-arm64.outcome != 'success'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: installer-win-arm64
          path: release-assets

      # ----- MCP server: macOS (prefer signed > unsigned) -----
      - name: Download signed MCP macOS x64
        id: signed-mcp-mac-x64
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: signed-mcp-mac-x64
          path: release-assets/mcp-mac-x64

      - name: Download unsigned MCP macOS x64 (fallback)
        if: steps.signed-mcp-mac-x64.outcome != 'success'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: mcp-mac-x64
          path: release-assets/mcp-mac-x64

      - name: Download signed MCP macOS arm64
        id: signed-mcp-mac-arm64
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: signed-mcp-mac-arm64
          path: release-assets/mcp-mac-arm64

      - name: Download unsigned MCP macOS arm64 (fallback)
        if: steps.signed-mcp-mac-arm64.outcome != 'success'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: mcp-mac-arm64
          path: release-assets/mcp-mac-arm64

      # ----- MCP server: Windows (prefer signed > unsigned) -----
      - name: Download signed MCP Windows x64
        id: signed-mcp-win-x64
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: signed-mcp-win-x64
          path: release-assets/mcp-win-x64

      - name: Download unsigned MCP Windows x64 (fallback)
        if: steps.signed-mcp-win-x64.outcome != 'success'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: mcp-win-x64
          path: release-assets/mcp-win-x64

      # ----- MCP server: Linux (unsigned, no signing needed) -----
      - name: Download MCP Linux x64
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: mcp-linux-x64
          path: release-assets/mcp-linux-x64

      - name: Download MCP Linux arm64
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: mcp-linux-arm64
          path: release-assets/mcp-linux-arm64

      # ----- Headless CLI daemon: Linux (unsigned, published as-is) -----
      # These artifacts are already named filemoverexpress-linux-<arch> by build-cli,
      # so they are downloaded straight into release-assets with no rename step.
      - name: Download CLI daemon Linux amd64
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: cli-linux-amd64
          path: release-assets

      - name: Download CLI daemon Linux arm64
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: cli-linux-arm64
          path: release-assets

      # ----- Rename MCP binaries for clarity -----
      - name: Rename MCP binaries with platform/arch suffix
        run: |
          set -euo pipefail
          rename_mcp() {
            local dir="$1" platform="$2" arch="$3" ext="${4:-}"
            local src="release-assets/${dir}/fme-mcp${ext}"
            # The signed macOS artifact carries the binary as a file named
            # "signed-fme-mcp" (the upload path in sign-mcp-macos), so match that name
            # too - otherwise the signed macOS MCP binary is silently dropped from the
            # release. Also handle it being nested in a subdirectory.
            if [ ! -f "$src" ]; then
              src=$(find "release-assets/${dir}" -type f \
                \( -name "fme-mcp${ext}" -o -name "signed-fme-mcp${ext}" \) 2>/dev/null | head -n1)
            fi
            if [ -f "$src" ]; then
              mv "$src" "release-assets/fme-mcp-${platform}-${arch}${ext}"
              echo "Renamed: fme-mcp-${platform}-${arch}${ext}"
            fi
          }
          # The macOS platform token is intentionally "darwin", not "macos": it matches
          # Go's GOOS value and the output of `uname` on macOS ("Darwin"), which is the
          # conventional token for CLI/server binaries and lets OS-detecting install
          # scripts resolve the right asset. The release-body MCP table uses the same
          # token. (The end-user-facing GUI .app/.dmg uses "File Mover Express" /
          # filemoverexpress and is a separate concern.)
          rename_mcp "mcp-mac-x64"     "darwin"  "amd64"
          rename_mcp "mcp-mac-arm64"   "darwin"  "arm64"
          rename_mcp "mcp-win-x64"     "windows" "amd64" ".exe"
          rename_mcp "mcp-linux-x64"   "linux"   "amd64"
          rename_mcp "mcp-linux-arm64" "linux"   "arm64"
          # Clean up subdirectories
          rm -rf release-assets/mcp-*

      # ----- List final assets -----
      - name: List release assets
        run: |
          echo "=== Release assets ==="
          find release-assets -type f | sort
          ASSET_COUNT=$(find release-assets -type f | wc -l)
          echo "Total: ${ASSET_COUNT} files"
          if [ "$ASSET_COUNT" -eq 0 ]; then
            echo "ERROR: no release assets found — all upstream jobs may have failed" >&2
            exit 1
          fi
          MCP_COUNT=$(find release-assets -type f -name "fme-mcp*" | wc -l)
          if [ "$MCP_COUNT" -eq 0 ]; then
            echo "::warning::No MCP server binaries in release assets. If build-mcp failed, this release will ship without the MCP server."
          fi

      # ----- Create GitHub Release -----
      - name: Determine if prerelease
        id: prerelease
        run: |
          if echo "${VERSION}" | grep -qE '\-'; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: File Mover Express ${{ env.VERSION }}
          draft: false
          prerelease: ${{ steps.prerelease.outputs.is_prerelease == 'true' }}
          generate_release_notes: true
          files: release-assets/*
          fail_on_unmatched_files: false
          body: |
            File Mover Express is a high-performance app for moving media between local
            storage and Amazon S3 - a Go transfer daemon plus a desktop GUI, a CLI, and an
            MCP server. What changed in this release is listed under **What's Changed** below.

            For a full feature overview, see the [README](https://github.com/awslabs/filemoverexpress#readme).

            ## Downloads

            | Platform | Architecture | Asset |
            |----------|-------------|-------|
            | macOS | Apple Silicon (arm64) | `filemoverexpress-macos-arm64.dmg` |
            | macOS | Intel (x64) | `filemoverexpress-macos-x64.dmg` |
            | Windows | x64 | `filemoverexpress-windows-amd64-installer.exe` |
            | Windows | arm64 | `filemoverexpress-windows-arm64-installer.exe` |

            ### Headless CLI daemon (Linux)

            Linux ships as a headless daemon, not a desktop app. Run it on a server,
            render farm, or cloud instance and drive it from a GUI on another machine
            over a remote-daemon connection. See the
            [Headless Linux Installation guide](docs/Headless-Linux-Installation.md).

            | Architecture | Asset |
            |-------------|-------|
            | x86_64 (Intel/AMD) | `filemoverexpress-linux-amd64` |
            | ARM64 (Graviton, etc.) | `filemoverexpress-linux-arm64` |

            ### MCP Server Binaries

            | Platform | Architecture | Asset |
            |----------|-------------|-------|
            | macOS | Apple Silicon | `fme-mcp-darwin-arm64` |
            | macOS | Intel | `fme-mcp-darwin-amd64` |
            | Windows | x64 | `fme-mcp-windows-amd64.exe` |
            | Linux | x64 | `fme-mcp-linux-amd64` |
            | Linux | arm64 | `fme-mcp-linux-arm64` |

            > **Linux desktop app** is not distributed: Linux is supported as a headless
            > CLI daemon only (see the table above). Control it from a GUI on another machine
            > over a remote-daemon connection. Building the desktop GUI from source is still
            > possible - see the [Installation guide](docs/Installation.md).
