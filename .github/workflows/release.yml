name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (semver format, e.g., 1.2.3)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  generate-protobuf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # v4
      - uses: ./.github/actions/setup-environment
        with:
          working-directory: src/protobuf
      - uses: ./.github/actions/generate-protobuf

  generate-bindings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # v4
      - uses: ./.github/actions/setup-environment
      - uses: ./.github/actions/generate-bindings

  generate-installer:
    needs: [generate-protobuf, generate-bindings]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            architecture: x64
            runner: ubuntu-latest
          - platform: linux
            architecture: arm64
            runner: ubuntu-24.04-arm
          - platform: mac
            architecture: x64
            runner: macos-15-intel
          - platform: mac
            architecture: arm64
            runner: macos-latest
          - platform: win
            architecture: x64
            runner: windows-latest
          - platform: win
            architecture: arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4 # v4
      - uses: ./.github/actions/setup-environment
      - uses: ./.github/actions/download-protobuf
      - uses: ./.github/actions/download-bindings
      - uses: ./.github/actions/generate-installer
        with:
          platform: ${{ matrix.platform }}
          architecture: ${{ matrix.architecture }}
          build-version: ${{ inputs.version || github.ref_name }}

  # ---------------------------------------------------------------------------
  # MCP server binary build (fme-mcp)
  #
  # Builds the standalone MCP server binary for all platforms. macOS and Windows
  # binaries are fed into the signing chains below.
  # ---------------------------------------------------------------------------
  build-mcp:
    needs: [generate-protobuf]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: mac
            architecture: x64
            runner: macos-15-intel
            goos: darwin
            goarch: amd64
          - platform: mac
            architecture: arm64
            runner: macos-latest
            goos: darwin
            goarch: arm64
          - platform: win
            architecture: x64
            runner: windows-latest
            goos: windows
            goarch: amd64
          - platform: linux
            architecture: x64
            runner: ubuntu-latest
            goos: linux
            goarch: amd64
          - platform: linux
            architecture: arm64
            runner: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-environment
      - uses: ./.github/actions/download-protobuf
      - name: Build fme-mcp
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          BUILD_VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          cd src/cli
          CGO_ENABLED=0 go build \
            -ldflags "-s -w -X \"main.Version=v${BUILD_VERSION}\"" \
            -o "../../dist/fme-mcp${{ matrix.goos == 'windows' && '.exe' || '' }}" \
            mcp-main.go
      - uses: actions/upload-artifact@v4
        with:
          name: mcp-${{ matrix.platform }}-${{ matrix.architecture }}
          path: dist/fme-mcp*
          retention-days: 30

  # ---------------------------------------------------------------------------
  # macOS code signing (CD Signer) + notarization (Apple notary)
  #
  # Gated behind the `MACOS_SIGNING_ENABLED` repository variable so releases keep
  # working before CD Signer onboarding + the `signing` environment secrets/vars
  # are in place. Set the variable to 'true' (and configure the secrets/vars
  # documented in sign-macos.yml / notarize-macos.yml) to activate the chain:
  #   build (.app) -> sign-macos (CD Signer -> signed .dmg) -> notarize-macos.
  # ---------------------------------------------------------------------------
  sign-macos:
    needs: [generate-installer]
    # Run whenever the workflow isn't cancelled (not only on full matrix success):
    # generate-installer is a matrix, so one failing platform leg would otherwise skip
    # this. The per-arch "download unsigned .app" step is the real guard — an arch whose
    # build didn't produce an installer fails there, while built arches still sign.
    if: ${{ !cancelled() && vars.MACOS_SIGNING_ENABLED == 'true' }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        architecture: [x64, arm64]
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/sign-macos.yml
    with:
      artifact-name: installer-mac-${{ matrix.architecture }}
      app-name: FileMoverExpressUI
      arch: ${{ matrix.architecture }}
    # Pass only the secrets sign-macos.yml declares (not `secrets: inherit`, which would
    # forward every repo/env secret to the reusable workflow).
    secrets:
      AWS_MACOS_SIGNING_ROLE_ARN: ${{ secrets.AWS_MACOS_SIGNING_ROLE_ARN }}
      CD_SIGNER_BUCKET_ACCESS_ROLE: ${{ secrets.CD_SIGNER_BUCKET_ACCESS_ROLE }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

  notarize-macos:
    needs: [sign-macos]
    if: ${{ !cancelled() && vars.MACOS_SIGNING_ENABLED == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        architecture: [x64, arm64]
    permissions:
      contents: read
    uses: ./.github/workflows/notarize-macos.yml
    with:
      signed-artifact-name: signed-installer-mac-${{ matrix.architecture }}
      dmg-filename: FileMoverExpressUI-${{ matrix.architecture }}.dmg
    # Pass only the secrets notarize-macos.yml declares (not `secrets: inherit`).
    secrets:
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

  # ---------------------------------------------------------------------------
  # MCP server macOS code signing (CD Signer, executables path)
  #
  # Signs the standalone fme-mcp binary using the same CD Signer infrastructure as
  # the main app. Uses the executables path (bare Mach-O, not a .app bundle) with
  # identifier com.amazon.filemoverexpress.mcp.
  # ---------------------------------------------------------------------------
  sign-mcp-macos:
    needs: [build-mcp]
    if: ${{ !cancelled() && vars.MACOS_SIGNING_ENABLED == 'true' }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        architecture: [x64, arm64]
    runs-on: macos-15
    timeout-minutes: 30
    environment: signing
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: ${{ vars.CD_SIGNER_REGION }}
      CD_SIGNER_API_BASE_URL: ${{ vars.CD_SIGNER_API_BASE_URL }}
      SIGNING_BUCKET: ${{ vars.MACOS_SIGNING_BUCKET }}
      BUNDLE_ID: ${{ vars.MACOS_BUNDLE_ID }}
      BUCKET_ACCESS_ROLE: ${{ secrets.CD_SIGNER_BUCKET_ACCESS_ROLE }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ARCH: ${{ matrix.architecture }}
    steps:
      - name: Download unsigned fme-mcp
        uses: actions/download-artifact@v4
        with:
          name: mcp-mac-${{ matrix.architecture }}
          path: ./unsigned

      - name: Set up Python for awscurl
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install signing dependencies
        run: |
          set -euo pipefail
          brew install gnu-tar
          python3 -m pip install --upgrade awscurl

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_MACOS_SIGNING_ROLE_ARN }}
          aws-region: ${{ vars.CD_SIGNER_REGION }}

      - name: Sign fme-mcp via CD Signer (executables path)
        run: |
          set -euo pipefail
          rm -rf mcp-pkg mcp-signed
          mkdir -p mcp-pkg/EXECUTABLES_TO_SIGN
          cp unsigned/fme-mcp mcp-pkg/EXECUTABLES_TO_SIGN/fme-mcp
          ( cd mcp-pkg && gtar -czf artifact.gz EXECUTABLES_TO_SIGN && gtar -czf package.tar.gz artifact.gz )

          IN_KEY="pre-signed/fme-mcp-${ARCH}.tar.gz"
          OUT_KEY="signed/fme-mcp-${ARCH}-signed.tar.gz"
          aws s3 cp mcp-pkg/package.tar.gz "s3://${SIGNING_BUCKET}/${IN_KEY}"

          cat > manifest.json <<EOF
          {
            "manifest": {
              "type": "app",
              "os": "osx",
              "name": "EXECUTABLES_TO_SIGN",
              "outputs": [{ "label": "macos", "path": "EXECUTABLES_TO_SIGN" }],
              "app": {
                "identifier": "${BUNDLE_ID}.mcp",
                "signing_requirements": {
                  "certificate_type": "developerIDAppDistribution",
                  "team_id": "${APPLE_TEAM_ID}"
                }
              }
            },
            "s3ArtifactLocations": {
              "bucketAccessRole": "${BUCKET_ACCESS_ROLE}",
              "bucket": "${SIGNING_BUCKET}",
              "inputKey": "${IN_KEY}",
              "outputKey": "${OUT_KEY}"
            }
          }
          EOF

          echo "Submitting fme-mcp sign-task:"
          cat manifest.json

          TASK_ID=""
          DELAY=15
          MAX_DELAY=120
          for attempt in 1 2 3 4 5 6; do
            RESP=$(awscurl --service signer-builder-tools --region "$AWS_REGION" -X POST \
              --header "Content-Type: application/json" --data @manifest.json \
              "${CD_SIGNER_API_BASE_URL}/v2/sign-tasks" 2>&1) || true
            echo "----- response (attempt ${attempt}) -----"
            echo "$RESP"
            echo "-----"
            TASK_ID=$(printf '%s' "$RESP" | jq -r '.signTaskId // empty' 2>/dev/null || true)
            [ -n "$TASK_ID" ] && break
            if printf '%s' "$RESP" | grep -qi "Too Many Requests"; then
              sleep "$DELAY"
              DELAY=$(( DELAY * 2 > MAX_DELAY ? MAX_DELAY : DELAY * 2 ))
              continue
            fi
            echo "ERROR: sign-task not created (non-retryable response above)" >&2
            exit 1
          done
          [ -n "$TASK_ID" ] || { echo "ERROR: sign-task not created after retries" >&2; exit 1; }
          echo "Created sign-task: ${TASK_ID}"

          for i in $(seq 1 90); do
            R=$(awscurl --service signer-builder-tools --region "$AWS_REGION" -X GET \
              --header "Content-Type: application/json" \
              "${CD_SIGNER_API_BASE_URL}/v2/sign-tasks/${TASK_ID}")
            S=$(printf '%s' "$R" | jq -r '.status // "unknown"')
            echo "Poll ${i}: ${S}"
            case "$S" in
              success) break ;;
              failure)
                echo "ERROR: signing failed" >&2
                printf '%s' "$R" | jq . >&2
                exit 1 ;;
              *) sleep 10 ;;
            esac
          done

          mkdir -p mcp-signed
          aws s3 cp "s3://${SIGNING_BUCKET}/${OUT_KEY}" mcp-signed/out
          ( cd mcp-signed
            if file out | grep -qi 'zip archive'; then ditto -x -k out .; else tar -xpf out 2>/dev/null || true; fi
            [ -f artifact.gz ] && tar -xpf artifact.gz 2>/dev/null || true )

          SIGNED=$(find mcp-signed -name fme-mcp -type f | head -n1)
          [ -n "$SIGNED" ] || { echo "ERROR: signed binary not found" >&2; find mcp-signed >&2; exit 1; }
          cp "$SIGNED" signed-fme-mcp
          chmod +x signed-fme-mcp

          echo "=== Verify signature ==="
          codesign --verify --strict --verbose=2 signed-fme-mcp
          if codesign --display --verbose=2 signed-fme-mcp 2>&1 | grep -qi "Signature=adhoc"; then
            echo "ERROR: fme-mcp is still ad-hoc signed" >&2
            exit 1
          fi
          echo "fme-mcp signed and verified"

      - name: Upload signed fme-mcp
        uses: actions/upload-artifact@v4
        with:
          name: signed-mcp-mac-${{ matrix.architecture }}
          path: signed-fme-mcp
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Windows code signing (AWS Code Signer / Wallaby, Authenticode)
  #
  # Gated behind the `WINDOWS_SIGNING_ENABLED` repository variable so releases keep
  # working before the `signing` environment secret/vars are in place. Set the variable
  # to 'true' (and configure AWS_SIGNING_ROLE_ARN + AWS_SIGNING_ACCOUNT_ID +
  # AWS_SIGNING_REGION, documented in sign-windows.yml) to activate signing the NSIS
  # installer .exe via the S3-bridge.
  #
  # architecture is the build matrix label (x64/arm64); nsis-arch is the token the
  # NSIS installer filename uses (amd64/arm64, chosen by GOARCH in the Windows Taskfile).
  # ---------------------------------------------------------------------------
  sign-windows:
    needs: [generate-installer]
    # Same rationale as sign-macos: run whenever not cancelled so a failing non-Windows
    # matrix leg doesn't skip this; the per-arch "download unsigned .exe" step is the guard.
    if: ${{ !cancelled() && vars.WINDOWS_SIGNING_ENABLED == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x64
            nsis-arch: amd64
          - architecture: arm64
            nsis-arch: arm64
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/sign-windows.yml
    with:
      artifact-name: installer-win-${{ matrix.architecture }}
      exe-filename: FileMoverExpressUI-${{ matrix.nsis-arch }}-installer.exe
    # Pass only the secret sign-windows.yml declares (not `secrets: inherit`).
    secrets:
      AWS_SIGNING_ROLE_ARN: ${{ secrets.AWS_SIGNING_ROLE_ARN }}

  # ---------------------------------------------------------------------------
  # MCP server Windows code signing (Wallaby / AWS Code Signer, Authenticode)
  #
  # Reuses the existing sign-windows.yml reusable workflow. Signs fme-mcp.exe using the
  # same Authenticode profile as the main installer.
  # ---------------------------------------------------------------------------
  sign-mcp-windows:
    needs: [build-mcp]
    if: ${{ !cancelled() && vars.WINDOWS_SIGNING_ENABLED == 'true' }}
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/sign-windows.yml
    with:
      artifact-name: mcp-win-x64
      exe-filename: fme-mcp.exe
    secrets:
      AWS_SIGNING_ROLE_ARN: ${{ secrets.AWS_SIGNING_ROLE_ARN }}
