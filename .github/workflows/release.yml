name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (semver format, e.g., 1.2.3)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-protobuf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # v4
      - uses: ./.github/actions/setup-environment
      - uses: ./.github/actions/build-protobuf

  generate-installer:
    needs: [build-protobuf]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            architecture: x64
            runner: ubuntu-latest
          - platform: linux
            architecture: arm64
            runner: ubuntu-24.04-arm
          - platform: mac
            architecture: x64
            runner: macos-15-intel
          - platform: mac
            architecture: arm64
            runner: macos-latest
          - platform: win
            architecture: x64
            runner: windows-latest
          - platform: win
            architecture: arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4 # v4
      - uses: ./.github/actions/setup-environment
      - uses: ./.github/actions/download-protobuf
      - uses: ./.github/actions/generate-installer
        with:
          platform: ${{ matrix.platform }}
          architecture: ${{ matrix.architecture }}
          build-version: ${{ inputs.version || github.ref_name }}
